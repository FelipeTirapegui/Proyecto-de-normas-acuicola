<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Motor de Impacto Regulatorio</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1622;
    color: #fff;
}
.header {
    display: flex;
    align-items: center;
    padding: 15px 30px;
}
.header img {
    height: 32px;
    opacity: 0.9;
}
h1 {
    margin: 20px 30px;
}
.container {
    display: flex;
    gap: 20px;
    padding: 20px 30px;
}
.card {
    flex: 1;
    border: 1px solid #1f2f45;
    padding: 15px;
    border-radius: 8px;
    background: #0f1e2d;
}
button {
    margin-top: 10px;
    padding: 10px;
    background: #1e90ff;
    border: none;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="header">
    <img src="./mrisk_logo.png" alt="m-risk">
</div>

<h1>Motor de Impacto Regulatorio</h1>

<div class="container">
    <div class="card">
        <h3>01 Cuerpo Normativo</h3>
        <textarea style="width:100%;height:120px;" placeholder="Pega aquí el texto normativo..."></textarea>
        <button>Clasificar</button>
    </div>

    <div class="card">
        <h3>02 Ingreso de Ley</h3>
        <p>Resultado del análisis aparecerá aquí</p>
    </div>

    <div class="card">
        <h3>03 Impacto por Mercado</h3>
        <p>El impacto regulatorio aparecerá aquí</p>
    </div>
</div>

</body>
</html>
